name: stats
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: holi
          ANIMATION: stagger
      - name: Calendrier des contributions
        run: python3 .github/scripts/calendrier.py ${{ github.repository_owner }} calendrier.svg
      - name: Commit du calendrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase --autostash origin main
          git add calendrier.svg
          git diff --cached --quiet || (git commit -m "Calendrier des contributions" && git push)
